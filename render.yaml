# Blueprint de Render para la API pública (manual, sección 12).
# Los secretos NO van aquí: Render los pide al crear el servicio (sync: false)
# y los dos archivos van como "Secret Files" en el panel de Render.
services:
  - type: web
    name: gestor-de-claves-api
    runtime: node
    plan: free
    # La región más cercana a la de tu proyecto de Supabase (frankfurt ↔ eu-west-1, Irlanda).
    # Render no deja cambiarla después de crear el servicio.
    region: frankfurt
    buildCommand: npm ci --include=dev
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Render pone la variable PORT; la API debe escuchar en todas las interfaces.
      - key: HOST
        value: 0.0.0.0
      # NO uses x-forwarded-for: Render conserva lo que manda el cliente y la primera IP
      # se puede falsificar (probado). True-Client-IP la pone Cloudflare, delante de Render.
      # Comprobado tras el despliegue (manual 12.6).
      - key: TRUSTED_IP_HEADER
        value: true-client-ip
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_CA_FILE
        value: /etc/secrets/supabase-ca.crt
      - key: SIGNING_PRIVATE_KEY_FILE
        value: /etc/secrets/signing-private.pem
      - key: SIGNING_KEY_ID
        sync: false
      - key: DATABASE_URL
        sync: false
